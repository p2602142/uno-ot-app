<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>UNO! Employee Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase SDK (Compat Version) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg-base: #F8F9FA;
    --bg-surface: #F1F3F5;
    --bg-card: #FFFFFF;
    --bg-input: #FFFFFF;
    
    --brand-red: #E33B26;
    --brand-red-hover: #C92A17;
    
    --ink-primary: #1F2937;
    --ink-secondary: #6B7280;
    --ink-muted: #9CA3AF;
    
    --pill-ot-bg: #FEE2E2;
    --pill-ot-ink: #DC2626;
    --pill-work-bg: #E5E7EB;
    --pill-work-ink: #374151;
    --pill-off-bg: #F3F4F6;
    --pill-off-ink: #9CA3AF;
    --pill-sick-bg: #FEE2E2;
    --pill-sick-ink: #EF4444;
    
    --border-color: #E5E7EB;
    --border-highlight: #FCA5A5;
    
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
    --shadow-float: 0 10px 25px rgba(0,0,0,0.1);
    --radius-card: 16px;
    --radius-btn: 10px;
    --radius-pill: 99px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--bg-base);
    color: var(--ink-primary);
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .app-container {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    padding: 0 16px 100px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .brand-banner {
    background: #FFFFFF;
    border: 1px solid var(--border-color);
    border-radius: 0 0 var(--radius-card) var(--radius-card);
    margin: 0 -16px 20px;
    padding: 20px 20px 18px;
    color: var(--ink-primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
  }
  .brand-logo-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1;
    margin: 0;
    color: var(--brand-red);
  }
  .brand-tag {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: var(--brand-red);
    color: #FFFFFF;
    padding: 2px 6px;
    border-radius: 3px;
    display: inline-block;
    margin-top: 4px;
  }

  .user-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-surface);
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border-color);
  }
  .user-badge span {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-primary);
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-secondary);
    margin-bottom: 6px;
  }
  input[type=text], input[type=password], select {
    width: 100%;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-btn);
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink-primary);
    background: var(--bg-input);
    transition: all 0.2s ease;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--brand-red);
    box-shadow: 0 0 0 3px rgba(227, 59, 38, 0.1);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 20px;
    border-radius: var(--radius-btn);
    border: none;
    font-family: 'Space Grotesk', 'Sarabun', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-brand { background: var(--brand-red); color: #FFFFFF; }
  .btn-brand:hover { background: var(--brand-red-hover); }
  .btn-icon {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: var(--ink-primary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  .btn-icon:hover { background: var(--bg-surface); border-color: var(--ink-muted); }

  .card {
    background: var(--bg-card);
    border-radius: var(--radius-card);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .card-title {
    font-family: 'Space Grotesk', 'Sarabun', sans-serif;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-primary);
    text-transform: uppercase;
    letter-spacing: -0.3px;
  }

  .metric-card {
    background: #FFFFFF;
    color: var(--ink-primary);
    border-radius: var(--radius-card);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-color);
  }
  .metric-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .metric-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .metric-val {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 38px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
    color: var(--brand-red);
  }

  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-btn);
    margin-bottom: 8px;
  }
  .user-meta-name { font-weight: 600; font-size: 14px; margin: 0; color: var(--ink-primary); }
  .user-meta-sub { font-size: 11px; color: var(--ink-secondary); margin: 0; }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 6px;
    font-family: 'Space Grotesk', 'Sarabun', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge-work { background: var(--pill-work-bg); color: var(--pill-work-ink); }
  .badge-off { background: var(--pill-off-bg); color: var(--pill-off-ink); }
  .badge-sick { background: var(--pill-sick-bg); color: var(--pill-sick-ink); }
  .badge-ot { background: var(--pill-ot-bg); color: var(--pill-ot-ink); border: 1px solid var(--border-highlight); }

  nav.bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 408px;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-pill);
    padding: 6px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: var(--shadow-float);
    z-index: 999;
  }
  nav.bottom-nav button {
    border: none;
    background: transparent;
    color: var(--ink-secondary);
    padding: 8px 16px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Space Grotesk', 'Sarabun', sans-serif;
    font-size: 12px;
    font-weight: 700;
    transition: all 0.2s ease;
  }
  nav.bottom-nav button.active { background: var(--brand-red); color: #FFFFFF; }
  nav.bottom-nav button svg { width: 18px; height: 18px; stroke-width: 2.2; }

  .login-box {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-card);
    padding: 28px 20px;
    box-shadow: var(--shadow-md);
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="brand-banner">
    <div>
      <h1 class="brand-logo-text">UNO!</h1>
      <div class="brand-tag">COFFEE COMPANY</div>
    </div>
    <div id="userBadgeArea"></div>
  </div>

  <main id="mainContent"></main>
  <nav id="bottomNavArea" class="bottom-nav" style="display:none;"></nav>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDTxQRCaJcf-NpVw2ULDJtjsD0tKlKkEUg",
  authDomain: "uno-coffee-ot.firebaseapp.com",
  projectId: "uno-coffee-ot",
  storageBucket: "uno-coffee-ot.firebasestorage.app",
  messagingSenderId: "423056554838",
  appId: "1:423056554838:web:7c49c55f15c2d6b66a34f7",
  measurementId: "G-19R1Y9H646"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const ICONS = {
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  logout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>'
};

const INITIAL_DATA = {
  users: {},
  employees: {},
  records: {}
};

const savedUser = JSON.parse(localStorage.getItem('uno_ot_user') || 'null');

const state = {
  db: INITIAL_DATA,
  currentUser: savedUser,
  activeTab: "my_ot",
  empFilterPeriod: "all",
  loginError: "",
  changePassError: "",
  isLoaded: false
};

// Realtime Firebase Listener
db.collection("ot_system").doc("app_data").onSnapshot((doc) => {
  if (doc.exists) {
    const cloudData = doc.data();
    state.db = {
      users: cloudData.users || {},
      employees: cloudData.employees || {},
      records: cloudData.records || {}
    };
    
    if (state.currentUser && state.db.users[state.currentUser.code]) {
      state.currentUser = state.db.users[state.currentUser.code];
      localStorage.setItem('uno_ot_user', JSON.stringify(state.currentUser));
    }
  }
  state.isLoaded = true;
  render();
}, (error) => {
  console.error("Firestore Listen Error: ", error);
  state.isLoaded = true;
  render();
});

function saveDatabaseToCloud(newData) {
  state.db = newData;
  db.collection("ot_system").doc("app_data").set(newData)
    .catch((error) => alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล: " + error.message));
}

// Helpers
function formatOT(decimalHours) {
  const totalMin = Math.round((decimalHours || 0) * 60);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${h}.${String(m).padStart(2, "0")}`;
}

function formatDateObj({ d, mo, y }) {
  return `${String(d).padStart(2, "0")}/${String(mo).padStart(2, "0")}/${y}`;
}

function getDateKey({ d, mo, y }) {
  return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function calculatePayCycle(ymdString) {
  const [y, mo, d] = ymdString.split("-").map(Number);
  let startMo = mo, startY = y, endMo = mo, endY = y;
  if (d <= 20) {
    startMo = mo - 1;
    if (startMo === 0) { startMo = 12; startY -= 1; }
  } else {
    endMo = mo + 1;
    if (endMo === 13) { endMo = 1; endY += 1; }
  }
  const start = { d: 21, mo: startMo, y: startY };
  const end = { d: 20, mo: endMo, y: endY };
  return {
    key: `${getDateKey(start)}_${getDateKey(end)}`,
    label: `${formatDateObj(start)} - ${formatDateObj(end)}`
  };
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// Render Components
function renderUserBadge() {
  const container = document.getElementById("userBadgeArea");
  if (!state.currentUser) { container.innerHTML = ""; return; }
  
  container.innerHTML = `
    <div class="user-badge">
      <span>${escapeHtml(state.currentUser.name)}</span>
      <button class="btn-icon" id="logoutBtn" style="width:24px; height:24px; background:transparent; border:none; color:var(--ink-secondary);" title="ออกจากระบบ">${ICONS.logout}</button>
    </div>
  `;
  document.getElementById("logoutBtn").onclick = () => {
    state.currentUser = null;
    localStorage.removeItem('uno_ot_user');
    state.loginError = "";
    render();
  };
}

function renderLogin() {
  const main = document.getElementById("mainContent");
  const bottomNav = document.getElementById("bottomNavArea");
  bottomNav.style.display = "none";

  main.innerHTML = `
    <div class="login-box">
      <h2 style="font-family:'Space Grotesk'; font-size: 20px; font-weight:700; margin:0 0 6px; text-transform:uppercase; color:var(--ink-primary);">Employee Portal</h2>
      <p style="font-size: 13px; color: var(--ink-secondary); margin:0 0 20px;">เข้าสู่ระบบดูเวลาทำงานพนักงาน UNO!</p>
      
      <form id="loginForm">
        <div class="field">
          <label>Staff ID (รหัสพนักงาน)</label>
          <input type="text" id="loginCode" placeholder="ระบุรหัสพนักงาน" required autofocus>
        </div>
        <div class="field">
          <label>Password (รหัสผ่าน)</label>
          <input type="password" id="loginPass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-brand" style="width: 100%; margin-top: 8px;">LOG IN</button>
      </form>
      ${state.loginError ? `<p style="color:var(--brand-red); font-size:12px; font-weight:600; text-align:center; margin-top:14px; margin-bottom:0;">${escapeHtml(state.loginError)}</p>` : ''}
    </div>
  `;

  document.getElementById("loginForm").onsubmit = (e) => {
    e.preventDefault();
    const code = document.getElementById("loginCode").value.trim();
    const pass = document.getElementById("loginPass").value.trim();
    const user = state.db.users ? state.db.users[code] : null;

    if (user && user.pass === pass && user.role === "employee") {
      state.currentUser = user;
      localStorage.setItem('uno_ot_user', JSON.stringify(user));
      state.loginError = "";
      state.activeTab = "my_ot";
      render();
    } else {
      state.loginError = "รหัสพนักงานหรือรหัสผ่านไม่ถูกต้อง";
      render();
    }
  };
}

function renderMainApp() {
  const main = document.getElementById("mainContent");
  const bottomNav = document.getElementById("bottomNavArea");
  
  const tabs = [
    { id: "my_ot", label: "OT ของฉัน", icon: "user" },
    { id: "my_settings", label: "ตั้งค่า", icon: "settings" }
  ];

  bottomNav.style.display = "flex";
  bottomNav.innerHTML = tabs.map(t => `
    <button class="${state.activeTab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')">
      ${ICONS[t.icon]}
      <span>${t.label}</span>
    </button>
  `).join("");

  main.innerHTML = `<div id="tabContent"></div>`;
  const container = document.getElementById("tabContent");

  if (state.activeTab === "my_ot") renderEmployeeView(container);
  else if (state.activeTab === "my_settings") renderEmployeeSettingsTab(container);
}

function switchTab(tabId) {
  state.activeTab = tabId;
  render();
}

function renderEmployeeView(container) {
  const code = state.currentUser.code;
  const name = state.currentUser.name;

  const periodMap = { "all": "ทั้งหมด" };
  Object.keys(state.db.records || {}).forEach(k => {
    const [, ymd] = k.split("|");
    const p = calculatePayCycle(ymd);
    periodMap[p.key] = p.label;
  });

  const periodKeys = Object.keys(periodMap).reverse();
  if (!state.empFilterPeriod) state.empFilterPeriod = "all";

  let totalOt = 0;
  const history = [];

  Object.entries(state.db.records || {}).forEach(([key, rows]) => {
    const [branch, ymd] = key.split("|");
    const p = calculatePayCycle(ymd);
    
    if (state.empFilterPeriod === "all" || state.empFilterPeriod === p.key) {
      const record = rows.find(r => r.code === code);
      if (record) {
        history.push({ ymd, branch, ...record });
        totalOt += (record.otHours || 0);
      }
    }
  });

  history.sort((a,b) => b.ymd.localeCompare(a.ymd));

  container.innerHTML = `
    <div class="metric-card">
      <div class="metric-header">
        <span class="metric-title">ACCUMULATED OVERTIME</span>
        <span class="badge badge-ot">EMPLOYEE</span>
      </div>
      <div class="metric-val">${formatOT(totalOt)} <span style="font-size:16px; font-weight:500; color:var(--ink-primary);">HRS</span></div>
    </div>

    <div class="card">
      <div class="field" style="margin-bottom:0;">
        <label>เลือกรอบเวลา</label>
        <select onchange="state.empFilterPeriod=this.value; render();">
          ${periodKeys.map(k => `<option value="${k}" ${k===state.empFilterPeriod?'selected':''}>${periodMap[k]}</option>`).join("")}
        </select>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">${ICONS.user} ประวัติการทำงาน: ${escapeHtml(name)}</div>
      </div>
      ${history.length === 0 ? `<div style="text-align:center; padding:24px; color:var(--ink-secondary);">ไม่มีข้อมูลประวัติในรอบเวลานี้</div>` : 
        history.map(h => `
          <div class="list-item">
            <div>
              <p class="user-meta-name">${h.ymd} (${escapeHtml(h.branch)})</p>
              <p class="user-meta-sub">${h.timeIn || '-'}${h.timeOut ? ' - ' + h.timeOut : ''}</p>
            </div>
            <div style="text-align:right;">
              <span class="badge ${h.status==='work'?'badge-work':h.status==='off'?'badge-off':'badge-sick'}">
                ${h.status==='work'?'WORK':h.status==='off'?'OFF':'LEAVE'}
              </span>
              <div style="margin-top:4px;">${h.otHours > 0 ? `<span class="badge badge-ot">+${formatOT(h.otHours)} HRS</span>` : ''}</div>
            </div>
          </div>
        `).join("")
      }
    </div>
  `;
}

function renderEmployeeSettingsTab(container) {
  container.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">เปลี่ยนรหัสผ่าน</div>
      </div>
      <form id="empChangePassForm">
        <div class="field">
          <label>รหัสผ่านปัจจุบัน</label>
          <input type="password" id="oldPass" required placeholder="••••••••">
        </div>
        <div class="field">
          <label>รหัสผ่านใหม่</label>
          <input type="password" id="newPass" required placeholder="••••••••">
        </div>
        <div class="field">
          <label>ยืนยันรหัสผ่านใหม่</label>
          <input type="password" id="confirmPass" required placeholder="••••••••">
        </div>
        
        ${state.changePassError ? `<p style="color:var(--brand-red); font-size:12px; margin-top:0; margin-bottom:12px;">${escapeHtml(state.changePassError)}</p>` : ''}
        
        <button type="submit" class="btn btn-brand" style="width:100%; margin-top:10px;">บันทึกรหัสผ่านใหม่</button>
      </form>
    </div>
  `;

  document.getElementById("empChangePassForm").onsubmit = (e) => {
    e.preventDefault();
    const oldPass = document.getElementById("oldPass").value.trim();
    const newPass = document.getElementById("newPass").value.trim();
    const confirmPass = document.getElementById("confirmPass").value.trim();
    const user = (state.db.users || {})[state.currentUser.code];

    if (oldPass !== user.pass) {
      state.changePassError = "รหัสผ่านปัจจุบันไม่ถูกต้อง";
      render();
      return;
    }

    if (newPass.length < 4) {
      state.changePassError = "รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร";
      render();
      return;
    }

    if (newPass !== confirmPass) {
      state.changePassError = "รหัสผ่านใหม่และการยืนยันไม่ตรงกัน";
      render();
      return;
    }

    const nextUsers = { ...(state.db.users || {}) };
    nextUsers[user.code].pass = newPass;
    state.currentUser.pass = newPass;
    localStorage.setItem('uno_ot_user', JSON.stringify(state.currentUser));
    state.changePassError = "";
    saveDatabaseToCloud({ ...state.db, users: nextUsers });
    alert("เปลี่ยนรหัสผ่านเรียบร้อยแล้ว");
    render();
  };
}

// Global Render Execution
function render() {
  if (!state.isLoaded) {
    document.getElementById("mainContent").innerHTML = `
      <div style="text-align:center; padding: 40px 0; color: var(--ink-secondary);">
        กำลังเชื่อมต่อฐานข้อมูล...
      </div>
    `;
    return;
  }

  renderUserBadge();
  if (!state.currentUser || state.currentUser.role !== "employee") {
    renderLogin();
  } else {
    renderMainApp();
  }
}

render();
</script>
</body>
</html>
