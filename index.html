// Helper Functions
function toMins(hhmm) {
  if (!hhmm) return null;
  const match = hhmm.trim().match(/^(\d{1,2}):(\d{2})$/);
  return match ? parseInt(match[1], 10) * 60 + parseInt(match[2], 10) : null;
}

function minsToHours(mins) { return Math.round((mins / 60) * 100) / 100; }

function formatOT(decimalHours) {
  const totalMin = Math.round((decimalHours || 0) * 60);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${h}.${String(m).padStart(2, "0")}`;
}

function parseThaiDate(str) {
  const match = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (!match) return null;
  let [, d, mo, y] = match.map(Number);
  if (y < 100) y += 2000;
  return { d, mo, y };
}

function formatDateObj({ d, mo, y }) {
  return `${String(d).padStart(2, "0")}/${String(mo).padStart(2, "0")}/${y}`;
}

function getDateKey({ d, mo, y }) {
  return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function calculatePayCycle(ymdString) {
  const [y, mo, d] = ymdString.split("-").map(Number);
  let startMo = mo, startY = y, endMo = mo, endY = y;
  if (d <= 20) {
    startMo = mo - 1;
    if (startMo === 0) { startMo = 12; startY -= 1; }
  } else {
    endMo = mo + 1;
    if (endMo === 13) { endMo = 1; endY += 1; }
  }
  const start = { d: 21, mo: startMo, y: startY };
  const end = { d: 20, mo: endMo, y: endY };
  return {
    key: `${getDateKey(start)}_${getDateKey(end)}`,
    label: `${formatDateObj(start)} - ${formatDateObj(end)}`
  };
}

function matchNearestShift(shifts, inMin) {
  if (inMin == null) return null;
  let selected = null, minDiff = Infinity;
  for (const s of shifts) {
    const sStart = toMins(s.start);
    if (sStart == null) continue;
    const diff = Math.abs(sStart - inMin);
    if (diff < minDiff) { minDiff = diff; selected = s; }
  }
  return selected;
}

function parseShiftText(rawText) {
  const text = rawText.trim();
  if (/^off$/i.test(text) || /^หยุด$/.test(text)) return { status: "off" };
  if (/ป่วย|ลาป่วย/.test(text)) return { status: "sick" };
  const rangeMatch = text.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
  if (rangeMatch) return { status: "work", timeIn: rangeMatch[1], timeOut: rangeMatch[2] };
  return { status: "work", timeIn: null, timeOut: null };
}

function calculateOT(row, shifts) {
  if (row.status !== "work") return { normalHours: 0, otHours: 0 };
  const inMin = toMins(row.timeIn);
  const outMin = toMins(row.timeOut);
  if (inMin == null || outMin == null) return { normalHours: 0, otHours: 0 };

  const shift = matchNearestShift(shifts, inMin);
  let otMin = 0;
  if (shift) {
    const shiftEnd = toMins(shift.end);
    if (shiftEnd != null && outMin > shiftEnd) otMin = outMin - shiftEnd;
  }
  const breakMin = shift ? (shift.breakMin || 0) : 0;
  const workedMin = outMin - inMin;
  return {
    normalHours: minsToHours(Math.max(workedMin - otMin - breakMin, 0)),
    otHours: minsToHours(Math.max(otMin, 0))
  };
}

function processReportText(text, shifts) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  let branch = "", dateObj = null;
  const rows = [];

  for (const line of lines) {
    const bMatch = line.match(/สาขา\s*([A-Za-zก-๙0-9_-]+)/);
    if (bMatch) branch = bMatch[1].trim();
    const dMatch = line.match(/วันที่\s*(\d{1,2}\/\d{1,2}\/\d{2,4})/);
    if (dMatch) dateObj = parseThaiDate(dMatch[1]);

    const rMatch = line.match(/^\d+[.)]\s*(\d{4,})\s+(\S+)\s+(.*)$/);
    if (rMatch) {
      const [, code, name, rest] = rMatch;
      const parsed = parseShiftText(rest);
      const row = { code, name, ...parsed };
      const calc = calculateOT(row, shifts);
      rows.push({ ...row, ...calc });
    }
  }
  return { branch, dateObj, rows };
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function renderMainApp() {
  const main = document.getElementById("mainContent");
  const bottomNav = document.getElementById("bottomNavArea");
  const isAdmin = state.currentUser.role === "admin";
  
  const tabs = isAdmin ? [
    { id: "entry", label: "บันทึก", icon: "upload" },

function commitSaveData() {
  const p = state.parsedPreview;
  if (!p || !p.branch || !p.dateObj) return;

  const key = `${p.branch}|${getDateKey(p.dateObj)}`;
  const nextEmps = { ...(state.db.employees || {}) };
  const nextUsers = { ...(state.db.users || {}) };

  p.rows.forEach(r => {
    nextEmps[r.code] = { code: r.code, name: r.name };
    if (!nextUsers[r.code]) {
      nextUsers[r.code] = { code: r.code, pass: "1234", role: "employee", name: r.name };
    }
  });

  const nextRecords = { ...(state.db.records || {}), [key]: p.rows };
  state.parsedPreview = null;
  saveDatabaseToCloud({ ...state.db, employees: nextEmps, users: nextUsers, records: nextRecords });
  alert("บันทึกข้อมูลเรียบร้อยแล้ว");
}

  state.activeModalKey = key;
  renderModal();
}

function renderSummaryTab(container) {
  const periodMap = {};
  const branchSet = new Set(["ทั้งหมด"]);

  Object.keys(state.db.records || {}).forEach(k => {
    const [b, ymd] = k.split("|");
    branchSet.add(b);
    const p = calculatePayCycle(ymd);
    periodMap[p.key] = p.label;
  });

  const periodKeys = Object.keys(periodMap).sort().reverse();
  if (!state.filterPeriod && periodKeys.length > 0) state.filterPeriod = periodKeys[0];

  const stats = {};
  Object.keys(state.db.employees || {}).forEach(code => {
    stats[code] = { ...state.db.employees[code], otHours: 0, workDays: 0, offDays: 0 };
  });

  if (state.filterPeriod) {
    Object.entries(state.db.records || {}).forEach(([k, rows]) => {
      const [b, ymd] = k.split("|");
      const p = calculatePayCycle(ymd);
      if (p.key === state.filterPeriod && (state.filterBranch === "ทั้งหมด" || state.filterBranch === b)) {
        rows.forEach(r => {
          if (!stats[r.code]) stats[r.code] = { code: r.code, name: r.name, otHours: 0, workDays: 0, offDays: 0 };
          stats[r.code].otHours += (r.otHours || 0);
          if (r.status === "work") stats[r.code].workDays++;
          if (r.status === "off") stats[r.code].offDays++;
        });
      }
    });
  }

  const totalOtPeriod = Object.values(stats).reduce((acc, curr) => acc + curr.otHours, 0);

  container.innerHTML = `
    <div class="metric-card">
      <div class="metric-header">
        <span class="metric-title">TOTAL OVERTIME</span>
        <span class="badge badge-ot">CYCLE 21-20</span>
      </div>
      <div class="metric-val">${formatOT(totalOtPeriod)} <span style="font-size:16px; font-weight:500;">HRS</span></div>
    </div>

    <div class="card">
      <div class="field" style="margin-bottom:10px;">
        <label>รอบเวลา</label>
        <select onchange="state.filterPeriod=this.value; render();">
          ${periodKeys.map(k => `<option value="${k}" ${k===state.filterPeriod?'selected':''}>${periodMap[k]}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>สาขา</label>
        <select onchange="state.filterBranch=this.value; render();">
          ${Array.from(branchSet).map(b => `<option value="${b}" ${b===state.filterBranch?'selected':''}>${b}</option>`).join("")}
        </select>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">สรุปรายพนักงาน (${Object.keys(stats).length} คน)</div>
      </div>
      ${Object.values(stats).map(s => `
        <div class="list-item">
          <div class="list-item-user">
            <div class="avatar-circle">${escapeHtml(s.name.substring(0,1))}</div>
            <div>
              <p class="user-meta-name">${escapeHtml(s.name)}</p>
              <p class="user-meta-sub">ทำ ${s.workDays} วัน | หยุด ${s.offDays} วัน</p>
            </div>
          </div>
          <span class="badge ${s.otHours > 0 ? 'badge-ot' : 'badge-off'}">${formatOT(s.otHours)} HRS</span>
        </div>
      `).join("")}
    </div>
  `;
}

function updateShift(id, field, val) {
  const nextShifts = (state.db.shifts || []).map(s => s.id === id ? { ...s, [field]: val } : s);
  saveDatabaseToCloud({ ...state.db, shifts: nextShifts });
}

function addShift() {
  const nextShifts = [...(state.db.shifts || []), { id: "s_" + Date.now(), start: "09:00", end: "18:00", breakMin: 0 }];
  saveDatabaseToCloud({ ...state.db, shifts: nextShifts });
}

function removeShift(id) {
  saveDatabaseToCloud({ ...state.db, shifts: (state.db.shifts || []).filter(s => s.id !== id) });
}

function updateEmpName(code, name) {
  const nextEmps = { ...(state.db.employees || {}), [code]: { code, name: name.trim() } };
  const nextUsers = { ...(state.db.users || {}) };
  if (nextUsers[code]) nextUsers[code].name = name.trim();
  saveDatabaseToCloud({ ...state.db, employees: nextEmps, users: nextUsers });
}

function updateEmpPass(code, pass) {
  const nextUsers = { ...(state.db.users || {}) };
  if (!nextUsers[code]) nextUsers[code] = { code, role: "employee", name: state.db.employees[code]?.name || code };
  nextUsers[code].pass = pass.trim();
  saveDatabaseToCloud({ ...state.db, users: nextUsers });
}

function addEmployee() {
  const code = prompt("ระบุรหัสพนักงาน:");
  if (!code) return;
  const name = prompt("ระบุชื่อพนักงาน:");
  if (!name) return;
  const pass = prompt("กำหนดรหัสผ่าน:", "1234") || "1234";

  const nextEmps = { ...(state.db.employees || {}), [code]: { code, name: name.trim() } };
  const nextUsers = { ...(state.db.users || {}), [code]: { code, pass: pass.trim(), role: "employee", name: name.trim() } };
  saveDatabaseToCloud({ ...state.db, employees: nextEmps, users: nextUsers });
}

function removeEmployee(code) {
  if (confirm(`ยืนยันการลบพนักงานรหัส ${code}?`)) {
    const nextEmps = { ...(state.db.employees || {}) };
    const nextUsers = { ...(state.db.users || {}) };
    delete nextEmps[code];
    delete nextUsers[code];
    saveDatabaseToCloud({ ...state.db, employees: nextEmps, users: nextUsers });
  }
}

function renderEmployeeView(container) {
  const code = state.currentUser.code;
  const name = state.currentUser.name;

  const periodMap = { "all": "ทั้งหมด" };
  Object.keys(state.db.records || {}).forEach(k => {
    const [, ymd] = k.split("|");
    const p = calculatePayCycle(ymd);
    periodMap[p.key] = p.label;
  });

  const periodKeys = Object.keys(periodMap).reverse();
  if (!state.empFilterPeriod) state.empFilterPeriod = "all";

  let totalOt = 0;
  const history = [];

  Object.entries(state.db.records || {}).forEach(([key, rows]) => {
    const [branch, ymd] = key.split("|");
    const p = calculatePayCycle(ymd);
    
    if (state.empFilterPeriod === "all" || state.empFilterPeriod === p.key) {
      const record = rows.find(r => r.code === code);
      if (record) {
        history.push({ ymd, branch, ...record });
        totalOt += (record.otHours || 0);
      }
    }
  });

  history.sort((a,b) => b.ymd.localeCompare(a.ymd));

  container.innerHTML = `
    <div class="metric-card">

        <span class="metric-title">ACCUMULATED OVERTIME</span>
        <span class="badge badge-ot">EMPLOYEE</span>
      </div>
      <div class="metric-val">${formatOT(totalOt)} <span style="font-size:16px; font-weight:500;">HRS</span></div>
    </div>

    <div class="card">
      <div class="field" style="margin-bottom:0;">
        <label>เลือกรอบเวลา</label>
        <select onchange="state.empFilterPeriod=this.value; render();">
          ${periodKeys.map(k => `<option value="${k}" ${k===state.empFilterPeriod?'selected':''}>${periodMap[k]}</option>`).join("")}
        </select>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">${ICONS.user} ประวัติการทำงาน: ${escapeHtml(name)}</div>
      </div>
      ${history.length === 0 ? `<div style="text-align:center; padding:24px; color:var(--ink-secondary);">ไม่มีข้อมูลประวัติในรอบเวลานี้</div>` : 
        history.map(h => `
          <div class="list-item">
            <div>
              <p class="user-meta-name">${h.ymd} (${escapeHtml(h.branch)})</p>
              <p class="user-meta-sub">${h.timeIn || '-'}${h.timeOut ? ' - ' + h.timeOut : ''}</p>
            </div>
            <div style="text-align:right;">
              <span class="badge ${h.status==='work'?'badge-work':h.status==='off'?'badge-off':'badge-sick'}">
                ${h.status==='work'?'WORK':h.status==='off'?'OFF':'LEAVE'}
              </span>
              <div style="margin-top:4px;">${h.otHours > 0 ? `<span class="badge badge-ot">+${formatOT(h.otHours)} HRS</span>` : ''}</div>
            </div>
          </div>
        `).join("")
      }
    </div>
  `;
}

function renderEmployeeSettingsTab(container) {
  container.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">${ICONS.key} เปลี่ยนรหัสผ่าน</div>
      </div>
      <form id="empChangePassForm">
        <div class="field">
          <label>รหัสผ่านปัจจุบัน</label>
          <input type="password" id="oldPass" required placeholder="••••••••">
        </div>
        <div class="field">
          <label>รหัสผ่านใหม่</label>
          <input type="password" id="newPass" required placeholder="••••••••">
        </div>
        <div class="field">
          <label>ยืนยันรหัสผ่านใหม่</label>
          <input type="password" id="confirmPass" required placeholder="••••••••">
        </div>
        
        ${state.changePassError ? `<p style="color:var(--brand-red); font-size:12px; margin-top:0; margin-bottom:12px;">${escapeHtml(state.changePassError)}</p>` : ''}
        
        <button type="submit" class="btn btn-brand" style="width:100%; margin-top:10px;">บันทึกรหัสผ่านใหม่</button>
      </form>
    </div>
  `;

  document.getElementById("empChangePassForm").onsubmit = (e) => {
    e.preventDefault();
    const oldPass = document.getElementById("oldPass").value.trim();
    const newPass = document.getElementById("newPass").value.trim();
    const confirmPass = document.getElementById("confirmPass").value.trim();
    const user = (state.db.users || {})[state.currentUser.code];

    if (oldPass !== user.pass) {
      state.changePassError = "รหัสผ่านปัจจุบันไม่ถูกต้อง";
      render();
      return;
    }

    if (newPass.length < 4) {
      state.changePassError = "รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร";
      render();
      return;
    }

    if (newPass !== confirmPass) {
      state.changePassError = "รหัสผ่านใหม่และการยืนยันไม่ตรงกัน";
      render();
      return;
    }

    const nextUsers = { ...(state.db.users || {}) };
    nextUsers[user.code].pass = newPass;
    state.currentUser.pass = newPass;
    localStorage.setItem('uno_ot_user', JSON.stringify(state.currentUser));
    state.changePassError = "";
    saveDatabaseToCloud({ ...state.db, users: nextUsers });
    alert("เปลี่ยนรหัสผ่านเรียบร้อยแล้ว");
    render();
  };
}

function renderModal() {
  const modalArea = document.getElementById("modalArea");

  if (!state.activeModalKey || !state.db.records[state.activeModalKey]) {
    modalArea.innerHTML = "";
    return;
  }

  const key = state.activeModalKey;
  const [branch, ymd] = key.split("|");
  const rows = state.db.records[key];

  modalArea.innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-box" onclick="event.stopPropagation()">
        <div class="card-header">
          <div class="card-title">รายละเอียดเวลาทำงาน</div>
          <button class="btn-icon" onclick="closeModal()">${ICONS.x}</button>
        </div>
        <p style="font-size:12px; color:var(--ink-secondary); margin-top:0; margin-bottom:12px;">สาขา: <b>${escapeHtml(branch)}</b> | วันที่: <b>${ymd}</b></p>
        
        <div style="max-height: 50vh; overflow-y: auto;">
          ${rows.map(r => `
            <div class="list-item">
              <div class="list-item-user">
                <div class="avatar-circle">${escapeHtml(r.name.substring(0,1))}</div>
                <div>
                  <p class="user-meta-name">${escapeHtml(r.name)} (${r.code})</p>
                  <p class="user-meta-sub">${r.timeIn || '-'}${r.timeOut ? ' - ' + r.timeOut : ''}</p>
                </div>
              </div>
              <span class="badge ${r.otHours > 0 ? 'badge-ot' : 'badge-off'}">${formatOT(r.otHours)} HRS</span>
            </div>
          `).join("")}
        </div>
      </div>
    </div>
  `;
}

function closeModal(e) {
  if (!e || e.target.classList.contains('modal-overlay') || e.target.closest('.btn-icon') || e.target.classList.contains('btn-secondary')) {
    state.activeModalKey = null;
    state.showChangePassModal = false;
    state.changePassError = "";
    renderModal();
  }
}

// MAIN RENDER LOGIC
function render() {
  if (!state.isLoaded) {
    document.getElementById("mainContent").innerHTML = `
      <div style="text-align:center; padding: 40px 0; color: var(--ink-secondary);">
        กำลังเชื่อมต่อฐานข้อมูล...
      </div>
    `;
    return;
  }

  renderUserBadge();
  if (!state.currentUser) {
    renderLogin();
  } else {
    renderMainApp();
    renderModal();
  }
}

render();
</script>
</body>
</html>
